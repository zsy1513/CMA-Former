# Frozen day-ahead forecasting protocol (working name: applied_energy).

data:
  markets: ['DE_LU', 'FR', 'NL', 'BE']
  raw_root: './data/raw'
  processed_path: './data/processed/dayahead_v2/master.parquet'
  start_date: '2019-01-01'
  end_date: '2024-12-31'
  train_start: '2019-01-16'
  train_end: '2022-12-31'
  val_start: '2023-01-01'
  val_end: '2023-06-30'
  test_start: '2023-07-01'
  test_end: '2024-12-31'
  timezone: 'Europe/Brussels'
  gate_closure_hour_local: 12
  lookback: 336
  horizon: 24
  skip_dst_transition_days: true
  flow_publication_lag_hours: 24
  financial_publication_lag_days: 1
  future_known_covariates:
    - published_current_day_prices
    - load_forecast
    - wind_solar_forecast
    - calendar
  historical_only_covariates:
    - lagged_physical_flow
    - lagged_ttf_gas
    - lagged_eua_carbon

coupling_prior:
  main_model_uses_prior: false
  sensitivity_mode: topology
  sensitivity_modes: [topology, fixed_topology, shuffled_topology]
  train_end_year: 2022
  export_provenance: true

model:
  d_model: 128
  patch_size: 16
  patch_stride: 8
  n_heads: 8
  d_ff: 256
  n_layers_intra: 3
  n_layers_cross: 2
  dropout: 0.1
  use_moe: false
  use_revin: false
  use_future_covariates: true
  future_covariate_integration: shared_adapter
  quantiles: [0.1, 0.5, 0.9]

training:
  seeds: [11, 22, 42, 77, 123]
  batch_size: 32
  epochs: 100
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 5
  early_stopping_patience: 15
  grad_clip: 1.0
  device: cuda

baselines:
  deterministic: [naive_previous_day, lear]
  neural: [patchtst, dlinear, nbeatsx, tft, itransformer, temporal_gat]
  structural_controls: [single_market_patchtst, concatenated_transformer]

ablations:
  - cma_no_cross
  - cma_topology_prior
  - cma_fixed_prior
  - cma_shuffled_prior
  - cma_late_future

evaluation:
  point_metrics: [mae, rmse, smape]
  negative_price_metrics: [precision, recall, f1, false_positive_rate]
  probabilistic_metrics:
    - mean_pinball_loss
    - coverage_80
    - interval_width_80
    - winkler_80
    - quantile_crossing_rate
  statistical_tests:
    daily_dm_hac: true
    moving_block_bootstrap: true
    bootstrap_block_days: 7
    bootstrap_resamples: 2000

interpretability:
  name: cross_market_attention_diagnostic
  source_market_masking: true
  source_market_permutation: true
  external_alignment:
    - absolute_price_spread
    - lagged_net_flow
    - negative_price_state
  move_lag_profile_to_appendix: true
